# https://www.electron.build/configuration/configuration
appId: com.vizlog.app
productName: Vizlog
copyright: Copyright © Basis Labs
# pnpm hoists electron to the repo root; pin the version for the packager.
electronVersion: 33.4.11

directories:
  output: release
  buildResources: build

# Include app output + dependencies; exclude source and the MCP staging folder (MCP is in extraResources).
files:
  - "**/*"
  - "!resources/**"
  - "!src/**"
  - "!ui/**"
  - "!scripts/**"
  - "!vite.config.ts"
  - "!electron-builder.yml"
  - "!tsconfig*.json"
  - "!release/**"

extraResources:
  - from: resources/mcp-server
    to: mcp-server
    filter:
      - "**/*"
  - from: resources/ffmpeg-bin
    to: ffmpeg-bin
    filter:
      - "**/*"
  - from: resources/cloudflared-bin
    to: cloudflared-bin
    filter:
      - "**/*"
  - from: resources/ocr-bin
    to: ocr-bin
    filter:
      - "**/*"
  - from: resources/sckit-bin
    to: sckit-bin
    filter:
      - "**/*"

asar: true
# sharp loads libvips from @img/sharp-libvips-* via dlopen; those paths break inside
# app.asar, so unpack native deps to app.asar.unpacked (see sharp pixelplumbing install docs).
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip

win:
  target:
    - nsis

linux:
  target:
    - AppImage

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
